name: Bygg och publicera till GitHub Pages

# Bygger sajten som statiska filer och publicerar dem till GitHub Pages
# vid varje push till main. Kräver INGET externt konto (ingen Vercel,
# inga secrets) — bara att GitHub Pages är påslaget för repot, se
# README.md, avsnittet "Publicera på GitHub Pages".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Validera eventdata
        run: npm run validate-events
      - name: Typecheck
        run: npm run typecheck

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installera dependencies
        run: npm ci

      - name: Bygg statisk export
        run: npm run build
        env:
          # Ger sidan rätt sökväg när den ligger på
          # https://<user>.github.io/<repo-namn>/ istället för rot-domänen.
          # Ta bort denna rad (eller sätt den till tom sträng) om du
          # istället publicerar på en egen domän eller en user/org
          # root-sajt (<user>.github.io utan repo-namn i URL:en).
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Förbered GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp byggartefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
